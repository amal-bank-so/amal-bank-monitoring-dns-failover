name: terraform-ci

on:
  push:
    paths: ["infra/**", ".github/workflows/terraform-ci.yml"]
  pull_request:
    paths: ["infra/**", ".github/workflows/terraform-ci.yml"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Redirect Function unit tests
        run: node --test infra/tools/redirect.test.mjs
      - name: Python tool unit tests (BIND converter, failover driver)
        run: |
          pip install -r infra/tools/requirements.txt
          python -W error::ResourceWarning -m unittest discover -s infra/tools
      - name: Format check
        run: terraform fmt -check -recursive infra
      - name: Validate every stack (no credentials, no backend)
        run: |
          for d in infra/stacks/shared infra/stacks/amalbank-so infra/stacks/ebanking infra/bootstrap; do
            echo "== $d"
            (cd "$d" && terraform init -backend=false -input=false && terraform validate)
          done
